name: Development CI

# Validation for development-branch pushes. Deliberately contains no
# release-publication step and requests no write permissions, so a dev run
# can never publish a GitHub release.
on:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read
  pull-requests: read

# Own group: never shared with the release workflow, so neither pipeline
# can cancel the other's authoritative validation run.
concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-pr:
    runs-on: ubuntu-latest
    outputs:
      has_pr: ${{ steps.check.outputs.has_pr }}
    steps:
      - name: Check for open PR targeting main
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set +e
          COUNT="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq 'length' 2>/dev/null)"
          if [ $? -ne 0 ] || [ -z "$COUNT" ]; then
            echo "PR check failed; failing open toward validation."
            COUNT=0
          fi
          if [ "$COUNT" -gt 0 ]; then HAS_PR=true; else HAS_PR=false; fi
          echo "has_pr=$HAS_PR" >> "$GITHUB_OUTPUT"
          echo "Branch $BRANCH has $COUNT open PR(s) targeting main -> has_pr=$HAS_PR"

  validate:
    needs: detect-pr
    if: needs.detect-pr.outputs.has_pr != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read app version and prepare release notes
        id: meta
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if ! grep -Fq "## ${VERSION_NAME}-dev" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a section for ${VERSION_NAME}-dev"
            exit 1
          fi
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"

      - name: Restore pinned signing key
        if: hashFiles('debug-signing/debug.keystore') != ''
        run: |
          mkdir -p ~/.android
          cp debug-signing/debug.keystore ~/.android/debug.keystore

      - name: Require pinned signing identity for distributable builds
        run: |
          if [ ! -f debug-signing/debug.keystore ]; then
            echo "::error::The pinned signing key is missing; refusing to build an APK."
            exit 1
          fi

      - name: Verify configured signing identity
        shell: bash
        run: |
          keytool -list -v -keystore "$GITHUB_WORKSPACE/debug-signing/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Owner:|SHA256:'
          SIGNING_REPORT="$(gradle :app:signingReport --no-daemon)"
          echo "$SIGNING_REPORT"
          echo "$SIGNING_REPORT" | grep -F "Store: $GITHUB_WORKSPACE/debug-signing/debug.keystore"
          echo "$SIGNING_REPORT" | grep -F "Alias: androiddebugkey"

      - name: Verify release-readiness declarations
        run: python3 scripts/verify_release_readiness.py

      - name: Run unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Verify unit tests executed
        run: python3 scripts/check_test_results.py app/build/test-results/testDebugUnitTest

      - name: Build Android release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify release APK signing certificate
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$CERT_OUTPUT"
          EXPECTED="$(keytool -exportcert -keystore "$GITHUB_WORKSPACE/debug-signing/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print toupper($1)}')"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/ {print toupper($NF); exit}')"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Release APK signer does not match the pinned signing key."
            exit 1
          fi

      - name: Rename APK using app version
        id: apk
        shell: bash
        run: |
          APK_NAME="MobileGamingStreamer-${{ steps.meta.outputs.version_name }}-dev-ci.apk"
          cp app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload dev APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileGamingStreamer-v${{ steps.meta.outputs.version_name }}-dev-ci
          path: app/build/outputs/apk/release/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 14
