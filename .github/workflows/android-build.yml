name: Android CI and APK Release

on:
  push:
    branches:
      - main
      - fix/stream-key-claymorphism
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Read app version and prepare release notes
        id: meta
        shell: bash
        run: |
          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9][0-9]*\)/\1/p' app/build.gradle.kts | head -n 1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle.kts"
            exit 1
          fi
          if ! grep -Fq "## ${VERSION_NAME}-dev" CHANGELOG.md; then
            echo "::error::CHANGELOG.md is missing a section for ${VERSION_NAME}-dev"
            exit 1
          fi
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
          } >> "$GITHUB_OUTPUT"
          awk -v prefix="## ${VERSION_NAME}-dev" '
            !found && index($0, prefix) == 1 { found=1 }
            found && /^## / && index($0, prefix) != 1 { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Restore pinned debug signing key
        if: hashFiles('debug-signing/debug.keystore') != ''
        run: |
          mkdir -p ~/.android
          cp debug-signing/debug.keystore ~/.android/debug.keystore

      # Legacy cache is used only to recover the original installable debug key.
      # Once pinned in the repository, every event and branch uses the same identity.
      - name: Restore legacy debug signing key for recovery
        if: hashFiles('debug-signing/debug.keystore') == ''
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgs-debug-signing-key-v1

      - name: Create temporary debug signing key if missing
        if: hashFiles('debug-signing/debug.keystore') == ''
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Temporary recovery step: preserve the exact signing key used by the last installable PR build.
      # This lets us pin that key in the repository and stop relying on event-scoped Actions caches.
      - name: Export debug signing key for signing continuity verification
        uses: actions/upload-artifact@v4
        with:
          name: mgs-debug-signing-key-recovery
          path: ~/.android/debug.keystore
          if-no-files-found: error
          retention-days: 7

      - name: Require pinned signing identity for distributable builds
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ ! -f debug-signing/debug.keystore ]; then
            echo "::error::The original debug signing key has not been pinned yet. Use the PR recovery artifact before publishing an installable APK."
            exit 1
          fi

      - name: Verify Gradle debug signing identity
        shell: bash
        run: |
          echo "HOME=$HOME"
          echo "ANDROID_USER_HOME=${ANDROID_USER_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "Cached keystore fingerprint:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'Owner:|SHA256:'
          echo "Gradle signing report:"
          SIGNING_REPORT="$(gradle :app:signingReport --no-daemon)"
          echo "$SIGNING_REPORT"
          echo "$SIGNING_REPORT" | grep -F "Store: $GITHUB_WORKSPACE/debug-signing/debug.keystore"
          echo "$SIGNING_REPORT" | grep -F "Alias: androiddebugkey"
          if echo "$SIGNING_REPORT" | grep -F "Error: Missing keystore"; then
            echo "::error::Gradle did not load the pinned debug keystore."
            exit 1
          fi

      - name: Verify release-readiness declarations
        run: python3 scripts/verify_release_readiness.py

      - name: Run unit tests and Android lint
        run: gradle :app:testDebugUnitTest :app:lintDebug --no-daemon

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Verify APK signing certificate
        shell: bash
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          CERT_OUTPUT="$("$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk)"
          echo "$CERT_OUTPUT"
          EXPECTED="$(keytool -exportcert -keystore "$GITHUB_WORKSPACE/debug-signing/debug.keystore" -storepass android -alias androiddebugkey | sha256sum | awk '{print toupper($1)}')"
          ACTUAL="$(printf '%s\n' "$CERT_OUTPUT" | awk -F': ' '/certificate SHA-256 digest:/ {print toupper($NF); exit}')"
          if [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer does not match the pinned debug keystore."
            exit 1
          fi

      - name: Rename APK using app version
        id: apk
        shell: bash
        run: |
          APK_NAME="MobileGamingStreamer-${{ steps.meta.outputs.version_name }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/$APK_NAME"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MobileGamingStreamer-v${{ steps.meta.outputs.version_name }}-debug
          path: app/build/outputs/apk/debug/${{ steps.apk.outputs.apk_name }}
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && hashFiles('debug-signing/debug.keystore') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.meta.outputs.version_name }}-dev.${{ github.run_number }}
          name: MobileGamingStreamer v${{ steps.meta.outputs.version_name }} — Development build #${{ github.run_number }}
          body_path: release-notes.md
          append_body: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/${{ steps.apk.outputs.apk_name }}
          fail_on_unmatched_files: true

      - name: Print release location
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "APK release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${{ steps.meta.outputs.version_name }}-dev.${{ github.run_number }}"
