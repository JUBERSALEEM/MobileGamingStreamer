name: Android CI and APK Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: mgs-debug-signing-key-v1

      - name: Create stable debug signing key if missing
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Rename APK for mobile installation
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/MobileGamingStreamer-0.5.10.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-gaming-streamer-debug
          path: app/build/outputs/apk/debug/MobileGamingStreamer-0.5.10.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-build-${{ github.run_number }}-${{ github.run_attempt }}
          name: MobileGamingStreamer development build #${{ github.run_number }}
          body_path: CHANGELOG.md
          append_body: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/MobileGamingStreamer-0.5.10.apk
          fail_on_unmatched_files: true
